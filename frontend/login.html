<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FixIt — Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="brand"><span class="gear">⚙️</span> FixIt</div>
      <h1 class="auth-title">Welcome back!</h1>
      <p class="auth-subtitle">Sign in to manage your reports</p>

      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="student@campus.ac.ke" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-field">
            <input type="password" id="password" placeholder="••••••••" required />
            <button type="button" class="password-toggle" id="toggle-password">👁</button>
          </div>
        </div>

        <div class="inline-row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember" /> Remember me
          </label>
          <a href="#" id="forgot-link">Forgot password?</a>
        </div>

        <p class="error-text" id="error-text"></p>

        <button type="submit" class="btn btn-primary" id="login-btn">Login</button>
      </form>

      <p class="auth-footer">Don't have an account? <a href="register.html">Sign up</a></p>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
